server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名，例如：official.adcs01.top
    
    root /path/to/your/project/.output/public;  # Nuxt 构建后的输出目录，例如：/var/www/website/.output/public
    index index.html;
    
    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    
    # 处理 Nuxt 静态资源（必须放在路由规则之前，优先级最高）
    # 处理 /nuxt/ 路径（匹配实际构建输出）
    # 注意：由于 root 已设置为 .output/public，/nuxt/ 请求会自动在 root/nuxt/ 查找
    location /nuxt/ {
        # 不需要 alias，因为 root 已经指向 .output/public
        # 只需确保文件存在即可
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 确保 JavaScript 文件的 MIME 类型正确
        types {
            application/javascript js mjs;
            text/css css;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/gif gif;
            image/webp webp;
        }
        # 如果文件不存在，返回 404（不要回退到 index.html）
        try_files $uri =404;
    }
    
    # 兼容处理 /_nuxt/ 路径（Nuxt 3 默认路径）
    location /_nuxt/ {
        # 重定向到 /nuxt/ 或者直接从 nuxt 目录提供
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        types {
            application/javascript js mjs;
            text/css css;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/gif gif;
            image/webp webp;
        }
        try_files $uri =404;
    }
    
    # 静态资源缓存（通用规则）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 处理 Nuxt 路由
    # 对于 SSG 模式，先尝试查找对应的 HTML 文件
    # 如果不存在，则回退到 index.html（用于客户端路由）
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
    
    # 处理 404 错误
    error_page 404 /index.html;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

